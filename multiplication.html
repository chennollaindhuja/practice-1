<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication of Two Numbers</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; }
        .container {
            max-width: 350px;
            margin: 60px auto;
            background: #fff;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            border-radius: 8px;
        }
        h2 { text-align: center; margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; margin-top: 16px; }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px 0;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #0056b3; }
        .result { text-align: center; margin-top: 18px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Multiply Two Numbers</h2>
        <form id="multiplyForm" onsubmit="event.preventDefault(); multiplyNumbers();">
            <label for="num1">First Number</label>
            <input type="number" id="num1" required>
            
            <label for="num2">Second Number</label>
            <input type="number" id="num2" required>
            
            <button type="submit">Multiply</button>
        </form>
        <div class="result" id="result"></div>
    </div>
    <script>
        function multiplyNumbers() {
            var num1 = parseFloat(document.getElementById('num1').value);
            var num2 = parseFloat(document.getElementById('num2').value);
            var product = num1 * num2;
            document.getElementById('result').innerText = 
                "Product: " + product;
        }
    </script>
</body>
</html>
